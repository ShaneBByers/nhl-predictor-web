<div class='card'>
    <div class='card-header'>
        TEAMS
    </div>
    <div class='card-body'>
        <div class='table-responsive'>
            <table class='table'
                *ngIf='teams.length'>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Division ID</th>
                        <th>Full Name</th>
                        <th>Location Name</th>
                        <th>Nickname</th>
                        <th>Abbreviation</th>
                        <th>Timezone</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor='let team of teams'>
                        <td>{{ team.ID }}</td>
                        <td>{{ team.DIVISION_ID }}</td>
                        <td>{{ team.FULL_NAME }}</td>
                        <td>{{ team.LOCATION_NAME }}</td>
                        <td>{{ team.NICKNAME }}</td>
                        <td>{{ team.ABBREVIATION }}</td>
                        <td>{{ team.TIMEZONE }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
